name: Update Taiwan Road Data & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 20:00 UTC = 04:00 Asia/Taipei, 08:00 UTC = 16:00 Asia/Taipei.
    - cron: '0 8,20 * * *'

permissions:
  contents: write

concurrency:
  group: update-road-data-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Sync Road Data JSON
        run: npm run sync:data

      - name: Detect data changes
        id: changes
        run: |
          if git diff --quiet -- public/*.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated Road Data JSON
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json
          git commit -m "chore: update Taiwan road data (Taipei, Kaohsiung, etc.)"
          git push

      - name: Build React Application
        run: npm run build
        env:
          CI: false

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build
          branch: gh-pages